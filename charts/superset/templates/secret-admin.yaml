{{- /*
The administrator's password when no existingSecret holds it: init.adminUser.password, or else a random password
generated at the first install and read back on later renders, so the administrator keeps it. Kept after an
uninstall: the administrator, and the password it was created with, outlive the release in the database.
*/}}
{{- if and .Values.init.enabled .Values.init.createAdmin (not .Values.init.adminUser.existingSecret) }}
{{- $name := include "superset.admin.secretName" . }}
{{- $key := .Values.init.adminUser.passwordKey | default "password" }}
{{- $password := .Values.init.adminUser.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := ($existing | default dict).data | default dict }}
{{- if hasKey $existingData $key }}
{{- $password = index $existingData $key | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "superset.fullname" . }}
    chart: {{ template "superset.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
