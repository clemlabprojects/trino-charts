{{- /* Shared artifacts volume: lets a scheduled run and the documentation pod work on
       one set of generated files instead of each producing its own. */ -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dbt.fullname" . }}-artifacts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbt.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
