{{- /*
profiles.yml, the file dbt reads to reach Trino. It is a Secret rather than a
ConfigMap because every authentication mode except "none" puts a credential in it.
An operator who prefers to manage the file themselves sets profiles.existingSecret
and this template renders nothing.
*/ -}}
{{- if not .Values.profiles.existingSecret }}
{{- $t := .Values.trino }}
{{- $auth := $t.auth }}
{{- $method := $auth.method | default "none" }}

{{- $krb := .Values.global.security.kerberos }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbt.fullname" . }}-profiles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbt.labels" . | nindent 4 }}
type: Opaque
stringData:
  profiles.yml: |
    {{ .Values.profiles.profileName }}:
      target: {{ .Values.profiles.target }}
      outputs:
        {{ .Values.profiles.target }}:
          type: trino
          method: {{ $method }}
          host: {{ required "trino.host is required unless profiles.existingSecret is set" $t.host | quote }}
          port: {{ $t.port }}
          database: {{ $t.catalog | quote }}
          schema: {{ $t.schema | quote }}
          threads: {{ $t.threads }}
          timezone: {{ $t.timezone | quote }}
          retries: {{ $t.retries }}
          user: {{ $auth.user | quote }}
          {{- /* http_scheme is only a field of the "none" method: every authenticated
                 method talks https by construction, and the adapter rejects the key. */}}
          {{- if eq $method "none" }}
          http_scheme: {{ $t.httpScheme | quote }}
          {{- end }}
          {{- if eq $method "ldap" }}
          password: {{ $auth.password | quote }}
          {{- if $auth.impersonationUser }}
          impersonation_user: {{ $auth.impersonationUser | quote }}
          {{- end }}
          {{- else if eq $method "jwt" }}
          jwt_token: {{ $auth.jwtToken | quote }}
          {{- else if or (eq $method "kerberos") (eq $method "gssapi") }}
          {{- if eq $method "kerberos" }}
          keytab: {{ printf "%s/%s" $krb.keytab.mountPath $krb.keytab.secretDataKey | quote }}
          {{- end }}
          principal: {{ required "global.security.kerberos.principal is required for the kerberos and gssapi methods" $krb.principal | quote }}
          service_name: {{ $auth.servicePrincipalName | quote }}
          mutual_authentication: {{ $auth.mutualAuthentication }}
          {{- if $krb.configMapName }}
          krb5_config: /etc/krb5.conf
          {{- end }}
          {{- else if eq $method "certificate" }}
          client_certificate: /etc/dbt/client-cert/{{ $auth.clientCertificateKey }}
          client_private_key: /etc/dbt/client-cert/{{ $auth.clientPrivateKey }}
          {{- end }}
          {{- /* A company CA is given to the Trino client as a verify path; "cert" is
                 what the adapter passes to requests. */}}
          {{- if include "dbt.tlsTrustEnabled" . }}
          cert: {{ include "dbt.caBundlePath" . | quote }}
          {{- end }}
          {{- with $t.sessionProperties }}
          session_properties:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.profiles.extraOutputConfig }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
{{- end }}
