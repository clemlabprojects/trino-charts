{{- /* OpenShift Route, emitted only on OpenShift when both the ingress and the route
       are enabled. Replaces the Ingress, which suppresses itself under the same test. */ -}}
{{- if and .Values.docs.enabled .Values.ingress.enabled .Values.route.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
{{- $host := (first .Values.ingress.hosts).host }}
{{- $path := (first (first .Values.ingress.hosts).paths).path | default "/" }}
{{- $tlsSecret := "" }}
{{- if .Values.ingress.tls }}{{- $tlsSecret = (tpl (first .Values.ingress.tls).secretName $) }}{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "dbt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbt.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ $host | quote }}
  path: {{ $path | quote }}
  to:
    kind: Service
    name: {{ include "dbt.fullname" . }}
    weight: 100
  port:
    targetPort: http
  {{- if $tlsSecret }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
  wildcardPolicy: None
{{- end }}
