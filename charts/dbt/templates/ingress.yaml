{{- /* On OpenShift the chart emits a Route instead (route.yaml), so this suppresses
       itself under the same condition to avoid exposing the site twice. */ -}}
{{- if and .Values.docs.enabled .Values.ingress.enabled }}
{{- if not (and .Values.route.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dbt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dbt.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dbt.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
