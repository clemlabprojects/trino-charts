{{- /*
KEDA TriggerAuthentication for authenticating a scaler (e.g. a Prometheus/Thanos trigger) with a bearer
token. Needed on OpenShift, where worker autoscaling reads metrics from the platform's built-in
(user-workload) monitoring via the thanos-querier tenancy endpoint, which requires a bearer token held
in a Secret. Enable with `server.keda.triggerAuthentication.enabled=true` and reference it from a trigger
via `authenticationRef.name`.
*/ -}}
{{- if and .Values.server.keda.enabled .Values.server.keda.triggerAuthentication.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Values.server.keda.triggerAuthentication.name | default (printf "%s-keda-auth" (include "trino.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: bearerToken
      name: {{ required "server.keda.triggerAuthentication.secretName is required when triggerAuthentication is enabled" .Values.server.keda.triggerAuthentication.secretName }}
      key: {{ .Values.server.keda.triggerAuthentication.secretKey | default "token" }}
{{- end }}
