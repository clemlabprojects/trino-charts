{{- $coordinatorJmx := merge .Values.jmx.coordinator (omit .Values.jmx "coordinator" "worker") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "trino.coordinator" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
{{- $auth := .Values.global.security.auth | default dict }}
{{- $authMode := lower (default "" $auth.mode) }}
{{- $ldapCfg := $auth.ldap | default dict }}
{{- $adCfg := $auth.ad | default dict }}
{{- $oidcCfg := $auth.oidc | default dict }}
{{- $ldapModeEnabled := or (eq $authMode "ldap") (eq $authMode "ad") }}
{{/* JWT authenticator (alongside OAUTH2) so programmatic clients — e.g. Superset over the trino
     python client — can authenticate to an OIDC-mode Trino with a bearer service JWT and then
     impersonate the end user. Defaults ON in oidc mode; key-file defaults to the Keycloak JWKS. */}}
{{- $jwtCfg := $oidcCfg.jwt | default dict }}
{{- $jwtEnabled := and (eq $authMode "oidc") (ne ($jwtCfg.enabled | toString) "false") }}
{{- $jwtKeyFile := default (printf "%s/protocol/openid-connect/certs" (default "" $oidcCfg.issuerUrl)) $jwtCfg.keyFile }}
{{- $jwtPrincipalField := default (default "preferred_username" $oidcCfg.userClaim) $jwtCfg.principalField }}
{{- $kdpsSu := (.Values.kdps | default dict).serviceUser | default dict }}
{{- $kdpsEnabled := eq ($kdpsSu.enabled | toString) "true" }}
{{- if and $kdpsEnabled (not .Values.server.config.https.enabled) }}{{ fail "kdps.serviceUser.enabled needs server.config.https.enabled=true: Trino refuses PASSWORD authentication over plain HTTP" }}{{ end }}
data:
  node.properties: |
    node.environment={{ tpl .Values.server.node.environment . }}
    node.data-dir={{ .Values.server.node.dataDir }}
    plugin.dir={{ .Values.server.node.pluginDir }}
  {{- range $configValue := .Values.additionalNodeProperties }}
    {{ $configValue }}
  {{- end }}
  {{- if .Values.dynamicCatalogs.enabled }}
  # Read by Trino's CatalogStoreManager (etc/catalog-store.properties), NOT config.properties.
  catalog-store.properties: |
    catalog.config-dir={{ .Values.dynamicCatalogs.storeDir }}
    catalog.read-only={{ .Values.dynamicCatalogs.readOnly }}
  {{- end }}

  jvm.config: |
    -server
    -agentpath:/usr/lib/trino/bin/libjvmkill.so
    {{- include "trino.jvm.heapOptions" (dict "jvm" .Values.coordinator.jvm "resources" .Values.coordinator.resources) | nindent 4 }}
    -XX:+{{ .Values.coordinator.jvm.gcMethod.type }}
    -XX:G1HeapRegionSize={{ .Values.coordinator.jvm.gcMethod.g1.heapRegionSize }}
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
    # Allow loading dynamic agent used by JOL
    -XX:+EnableDynamicAgentLoading
  {{/* only check the version number if the image is not overriden in any way */}}
  {{- with .Values.image -}}
  {{- if and (eq .repository "trinodb/trino") (not .useRepositoryAsSoleImageReference) (not .registry) (not .digest) (gt (default $.Chart.AppVersion .tag | int ) 447 ) }}
    # https://bugs.openjdk.org/browse/JDK-8329528
    -XX:+UnlockDiagnosticVMOptions
    -XX:G1NumCollectionsKeepPinned=10000000
  {{- end }}{{/* if */}}
  {{- end }}{{/* with */}}
  {{- range $configValue := .Values.coordinator.additionalJVMConfig }}
    {{ $configValue }}
  {{- end }}
  {{- if and .Values.global.security.tls.enabled .Values.global.security.tls.truststore.enabled .Values.global.security.tls.truststoreSecret }}
  {{- $tsMount := default "/etc/security/truststore/truststore.jks" .Values.global.security.tls.mountPath }}
  {{- $tsSecret := lookup "v1" "Secret" .Release.Namespace .Values.global.security.tls.truststoreSecret }}
  {{- $tsPassKey := default "truststore.password" .Values.global.security.tls.truststorePasswordKey }}
  {{- $tsPass := "" }}{{- if $tsSecret }}{{- $tsPass = index $tsSecret.data $tsPassKey | b64dec }}{{- end }}
    -Djavax.net.ssl.trustStore={{ $tsMount }}
    {{- if $tsPass }}
    -Djavax.net.ssl.trustStorePassword={{ $tsPass }}
    {{- end }}
  {{- end }}
  {{- if $coordinatorJmx.enabled }}
    -Dcom.sun.management.jmxremote.rmi.port={{- $coordinatorJmx.serverPort }}
  {{- end }}

  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator={{ .Values.coordinator.config.nodeScheduler.includeCoordinator }}
    http-server.http.port={{ .Values.service.port }}
    query.max-memory={{ .Values.server.config.query.maxMemory }}
    query.max-memory-per-node={{ .Values.coordinator.config.query.maxMemoryPerNode }}
    {{- if .Values.coordinator.config.memory.heapHeadroomPerNode }}
    memory.heap-headroom-per-node={{ .Values.coordinator.config.memory.heapHeadroomPerNode }}
    {{- end }}
    discovery.uri=http://localhost:{{ .Values.service.port }}
    {{- if .Values.server.config.authenticationType }}
    http-server.authentication.type={{ .Values.server.config.authenticationType }}{{ if and $kdpsEnabled (not (contains "PASSWORD" .Values.server.config.authenticationType)) }},PASSWORD{{ end }}
    {{- else if $ldapModeEnabled }}
    web-ui.authentication.type=FORM
    http-server.authentication.type=PASSWORD
    {{- else if eq $authMode "oidc" }}
    web-ui.authentication.type=OAUTH2
    http-server.authentication.type=OAUTH2{{ if $jwtEnabled }},JWT{{ end }}{{ if $kdpsEnabled }},PASSWORD{{ end }}
    http-server.authentication.oauth2.issuer={{ $oidcCfg.issuerUrl }}
    {{- /* From the env, whichever source "trino.security.env" reads them from: the client's own Secret
           (secretRef, which wins), or the inline client id and the chart's credentials Secret. */}}
    {{- if or ($oidcCfg.secretRef | default dict).name $oidcCfg.clientId }}
    http-server.authentication.oauth2.client-id=${ENV:OIDC_CLIENT_ID}
    http-server.authentication.oauth2.client-secret=${ENV:OIDC_CLIENT_SECRET}
    http-server.authentication.oauth2.additional-audiences=${ENV:OIDC_CLIENT_ID}
    {{- end }}
    http-server.authentication.oauth2.scopes={{ default "openid email profile" $oidcCfg.scopes }}
    {{- if $oidcCfg.userClaim }}
    http-server.authentication.oauth2.principal-field={{ $oidcCfg.userClaim }}
    {{- end }}
    {{- if $jwtEnabled }}
    http-server.authentication.jwt.key-file={{ $jwtKeyFile }}
    http-server.authentication.jwt.principal-field={{ $jwtPrincipalField }}
    {{- if $jwtCfg.requiredAudience }}
    http-server.authentication.jwt.required-audience={{ $jwtCfg.requiredAudience }}
    {{- end }}
    {{- end }}
    {{- else if $kdpsEnabled }}
    http-server.authentication.type=PASSWORD
    {{- end }}
    {{- /* Properties the chart writes from a Secret. The same property in additionalConfigProperties is left out:
           its literal value would sit in this ConfigMap. Values written by earlier KDPS versions carried both. */}}
    {{- $fromSecrets := list }}
    {{- if or .Values.server.config.authenticationType $ldapModeEnabled (eq $authMode "oidc") $kdpsEnabled }}
    {{- $fromSecrets = append $fromSecrets "internal-communication.shared-secret" }}
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
    {{- end }}
    {{- if and .Values.server.config.https.keystore.secretName .Values.server.config.https.keystore.passwordSecretName .Values.server.config.https.enabled }}
    {{- /* appended by the init-https-keystore init container, from the keystore password Secret */}}
    {{- $fromSecrets = append $fromSecrets "http-server.https.keystore.key" }}
    {{- end }}
    {{- if or $ldapModeEnabled $kdpsEnabled }}
    {{- $pwFiles := list }}
    {{- if or $ldapModeEnabled .Values.auth.passwordAuth .Values.auth.passwordAuthSecret }}{{- $pwFiles = append $pwFiles (printf "%s/password-authenticator.properties" .Values.server.config.path) }}{{- end }}
    {{- if $kdpsEnabled }}{{- $pwFiles = append $pwFiles (printf "%s/kdps-password-authenticator.properties" .Values.server.config.path) }}{{- end }}
    password-authenticator.config-files={{ join "," $pwFiles }}
    {{- end }}
    {{- range $configValue := concat (.Values.additionalConfigProperties | default list) (.Values.coordinator.additionalConfigProperties | default list) }}
    {{- if not (has (include "trino.propertyKey" $configValue) $fromSecrets) }}
    {{ $configValue }}
    {{- end }}
    {{- end }}
    {{- if .Values.dynamicCatalogs.enabled }}
    catalog.management=dynamic
    catalog.store=file
    {{- end }}
    {{- if .Values.server.config.https.enabled }}
    http-server.https.enabled=true
    http-server.https.port={{ .Values.server.config.https.port }}
    http-server.https.keystore.path={{ .Values.server.config.https.keystore.path }}
    {{- end }}
    {{- if $coordinatorJmx.enabled }}
    jmx.rmiregistry.port={{- $coordinatorJmx.registryPort }}
    jmx.rmiserver.port={{- $coordinatorJmx.serverPort }}
    {{- end }}
    {{- if .Values.worker.gracefulShutdown.enabled }}
    shutdown.grace-period={{- .Values.worker.gracefulShutdown.gracePeriodSeconds -}}s
    {{- end }}
    {{- if .Values.server.coordinatorExtraConfig }}
    {{- .Values.server.coordinatorExtraConfig | nindent 4 }}
    {{- end }}

{{- if .Values.accessControl }}
  {{- $t := lower (default "" .Values.accessControl.type) }}

  {{- if eq $t "configmap" }}
  access-control.properties: |
    access-control.name=file
    {{- if .Values.accessControl.refreshPeriod }}
    security.refresh-period={{ .Values.accessControl.refreshPeriod }}
    {{- end }}
    security.config-file={{ .Values.server.config.path }}/access-control/{{ .Values.accessControl.configFile | default "rules.json" }}

  {{- else if eq $t "properties" }}
  access-control.properties: |
    {{- if .Values.accessControl.properties }}
    {{- .Values.accessControl.properties | nindent 4 }}
    {{- else }}
    {{- fail "accessControl.properties is required when accessControl.type = 'properties'." }}
    {{- end }}

  {{- else if eq $t "ranger" }}
  access-control.properties: |
    access-control.name=ranger
    {{- if not .Values.ranger.serviceName }}
    {{- fail "ranger.serviceName is required when accessControl.type = 'ranger'." }}
    {{- end }}
    ranger.service.name={{ .Values.ranger.serviceName }}
    ranger.plugin.config.resource=/etc/trino/ranger/ranger-trino-security.xml,/etc/trino/ranger/ranger-trino-audit.xml{{- if .Values.ranger.admin.ssl.enabled }},{{ .Values.ranger.policymgrssl_path }}{{- end }}
    ranger.hadoop.config.resource=/etc/hadoop/conf/core-site.xml,/etc/hadoop/conf/hdfs-site.xml
  {{- else }}
  {{- fail "Invalid accessControl.type. Must be one of: 'configmap', 'properties', or 'ranger'." }}
  {{- end }}
{{- end }}

{{- if .Values.resourceGroups }}
  {{- if eq .Values.resourceGroups.type "configmap" }}
  resource-groups.properties: |
    resource-groups.configuration-manager=file
    resource-groups.config-file={{ .Values.server.config.path }}/resource-groups/resource-groups.json
  {{- else if eq .Values.resourceGroups.type "properties" }}
  resource-groups.properties: |
    {{- if .Values.resourceGroups.properties }}
    {{- .Values.resourceGroups.properties | nindent 4 }}
    {{- else}}
    {{- fail "resourceGroups.properties is required when resourceGroups.type is 'properties'." }}
    {{- end }}
  {{- else}}
  {{- fail "Invalid resourceGroups.type value. It must be either 'configmap' or 'properties'." }}
  {{- end }}
{{- end }}

{{- if .Values.sessionProperties }}
  {{- if eq .Values.sessionProperties.type "configmap" }}
  session-property-config.properties: |
    session-property-config.configuration-manager=file
    session-property-manager.config-file={{ .Values.server.config.path }}/session-property-config.json

  session-property-config.json: |
    {{- .Values.sessionProperties.sessionPropertiesConfig | nindent 4 }}
  {{- else if eq .Values.sessionProperties.type "properties" }}
  session-property-config.properties: |
    {{- if .Values.sessionProperties.properties }}
    {{- .Values.sessionProperties.properties | nindent 4 }}
    {{- else}}
    {{- fail "sessionProperties.properties is required when sessionProperties.type is 'properties'." }}
    {{- end }}
  {{- else}}
  {{- fail "Invalid sessionProperties.type value. It must be either 'configmap' or 'properties'." }}
  {{- end }}
{{- end }}

{{- if .Values.server.exchangeManager }}
  exchange-manager.properties: |
    exchange-manager.name={{ .Values.server.exchangeManager.name }}
    exchange.base-directories={{ join "," .Values.server.exchangeManager.baseDir }}
  {{- range $configValue := .Values.additionalExchangeManagerProperties }}
    {{ $configValue }}
  {{- end }}
{{- end }}

  log.properties: |
    io.trino={{ .Values.server.log.trino.level }}
  {{- range $configValue := .Values.additionalLogProperties }}
    {{ $configValue }}
  {{- end }}

  {{- if or (contains "PASSWORD" .Values.server.config.authenticationType) $ldapModeEnabled }}{{- if not (index .Values.coordinator.additionalConfigFiles "password-authenticator.properties") }}
  {{- if $ldapModeEnabled }}
  {{- $ldapUrl := default "" $ldapCfg.url }}
  {{- if eq $authMode "ad" }}
  {{- $ldapUrl = default $adCfg.url $ldapUrl }}
  {{- end }}
  {{- $bindPattern := "" }}
  {{- if $ldapCfg.userDnTemplate }}
  {{- /* The security profile writes the user name as {0} (the form Superset reads); Trino only replaces ${USER}. */}}
  {{- $bindPattern = replace "{0}" "${USER}" $ldapCfg.userDnTemplate }}
  {{- else if and (eq $authMode "ad") $adCfg.domain }}
  {{- $bindPattern = printf "${USER}@%s" $adCfg.domain }}
  {{- end }}
  {{- $baseDn := $ldapCfg.baseDn }}
  {{- if eq $authMode "ad" }}
  {{- $baseDn = default $adCfg.baseDn $baseDn }}
  {{- end }}
  {{- $bindDn := $ldapCfg.bindDn }}
  {{- if eq $authMode "ad" }}
  {{- $bindDn = default $adCfg.bindDn $bindDn }}
  {{- end }}
  {{- $userFilter := $ldapCfg.userSearchFilter }}
  {{- if eq $authMode "ad" }}
  {{- $userFilter = default $adCfg.userSearchFilter $userFilter }}
  {{- end }}
  {{- $userBaseDn := default $ldapCfg.groupSearchBase $baseDn }}
  {{- /* With a bind DN, Trino finds the user with ldap.group-auth-pattern, and refuses to start without it. Superset and
         OpenMetadata build that search themselves, so when the profile leaves the pattern empty it is built the way
         Superset builds it: the login attribute (sAMAccountName on AD, uid on LDAP), with the profile's user search
         filter as an extra condition. A filter that already names the user ({0}) is the whole search. */}}
  {{- $groupPattern := replace "{0}" "${USER}" (default "" $ldapCfg.groupAuthPattern) }}
  {{- if and $bindDn (not $groupPattern) }}
  {{- $loginMatch := ternary "(&(objectClass=user)(sAMAccountName=${USER}))" "(&(objectClass=person)(uid=${USER}))" (eq $authMode "ad") }}
  {{- if and $userFilter (contains "{0}" $userFilter) }}
  {{- $groupPattern = replace "{0}" "${USER}" $userFilter }}
  {{- else if $userFilter }}
  {{- $groupPattern = printf "(&%s%s)" $loginMatch $userFilter }}
  {{- else }}
  {{- $groupPattern = $loginMatch }}
  {{- end }}
  {{- end }}
  {{- if and $groupPattern (not $userBaseDn) }}
  {{- fail "Trino LDAP login needs the Base DN of the security profile: Trino searches for users under it" }}
  {{- end }}
  password-authenticator.properties: |
    password-authenticator.name=ldap
    {{- if $ldapUrl }}
    ldap.url={{ $ldapUrl }}
    {{- end }}
    {{- if $bindPattern }}
    ldap.user-bind-pattern={{ $bindPattern }}
    {{- end }}
    {{- if $userBaseDn }}
    ldap.user-base-dn={{ $userBaseDn }}
    {{- end }}
    {{- if $groupPattern }}
    ldap.group-auth-pattern={{ $groupPattern }}
    {{- end }}
    {{- if $bindDn }}
    ldap.bind-dn={{ $bindDn }}
    {{- end }}
    {{- if include "trino.auth.hasBindPassword" $ }}
    ldap.bind-password=${ENV:TRINO_LDAP_PASSWORD}
    {{- end }}
    {{- if not (or (hasPrefix "ldaps://" $ldapUrl) $ldapCfg.startTls) }}
    ldap.allow-insecure=true
    {{- end }}
    {{- if eq (lower (default "" $ldapCfg.referral)) "ignore" }}
    ldap.ignore-referrals=true
    {{- end }}
  {{- else }}
  password-authenticator.properties: |
    password-authenticator.name=file
    file.password-file={{ .Values.server.config.path }}/auth/password/password.db
  {{- end }}
  {{- end }}{{- end }}

  {{- if or .Values.auth.groups .Values.auth.groupsAuthSecret }}{{- if not (index .Values.coordinator.additionalConfigFiles "group-provider.properties") }}
  group-provider.properties: |
    group-provider.name=file
    file.group-file={{ .Values.server.config.path }}/auth/group/group.db
    {{- if .Values.auth.refreshPeriod }}
    file.refresh-period={{ .Values.auth.refreshPeriod }}
    {{- end }}
  {{- end }}{{- end }}
  {{- if $kdpsEnabled }}
  kdps-password-authenticator.properties: |
    password-authenticator.name=file
    file.password-file={{ .Values.server.config.path }}/auth/kdps/password.db
  {{- end }}

{{ if .Values.eventListenerProperties }}
  event-listener.properties: |
  {{- range $configValue := .Values.eventListenerProperties }}
    {{ $configValue }}
  {{- end }}
{{ end }}

{{- range $fileName, $fileContent := .Values.coordinator.additionalConfigFiles }}
  {{ $fileName }}: |
    {{- tpl $fileContent $ | nindent 4 }}
{{- end }}
{{- if eq .Values.resourceGroups.type "configmap" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "trino.fullname" . }}-resource-groups-volume-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
data:
  resource-groups.json: |-
    {{- .Values.resourceGroups.resourceGroupsConfig | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "trino.fullname" . }}-schemas-volume-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
data:
  {{- range $key, $val := .Values.kafka.tableDescriptions }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
