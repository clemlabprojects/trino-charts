{{- $authMode := ((.Values.global).security).auth | default dict | dig "mode" "" -}}
{{- if ne $authMode "" -}}
{{- $secretName := printf "%s-internal-communication" (include "trino.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $sharedSecret := "" -}}
{{- if $existing -}}
  {{- $sharedSecret = index $existing.data "shared-secret" | b64dec -}}
{{- else -}}
  {{- $sharedSecret = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
type: Opaque
data:
  shared-secret: {{ $sharedSecret | b64enc }}
---
{{- end -}}
{{- if and (not .Values.auth.passwordAuthSecret) .Values.auth.passwordAuth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "trino.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
data:
{{- if .Values.auth.passwordAuth }}
  password.db: {{ .Values.auth.passwordAuth | b64enc }}
{{- end }}
{{- end }}
---
{{- if and (not .Values.auth.groupsAuthSecret) .Values.auth.groups }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "trino.groupsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
data:
{{- if .Values.auth.groups}}
  group.db: {{ .Values.auth.groups | b64enc }}
{{- end }}
{{- end }}
---
{{- $pc := .Values.polarisCredential | default dict }}
{{- $pref := $pc.secretRef | default dict }}
{{- if and (not $pref.name) $pc.clientId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-polaris-credential" (include "trino.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
type: Opaque
data:
  client_id: {{ $pc.clientId | b64enc }}
  client_secret: {{ $pc.clientSecret | default "" | b64enc }}
{{- end }}

{{- $sc := .Values.s3Credential | default dict }}
{{- $scref := $sc.secretRef | default dict }}
{{- if and (not $scref.name) $sc.accessKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trino.fullname" . }}-iceberg-s3-credential
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
type: Opaque
data:
  access_key: {{ $sc.accessKey | b64enc | quote }}
  secret_key: {{ $sc.secretKey | default "" | b64enc | quote }}
{{- end }}
