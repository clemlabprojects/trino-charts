{{- /* The bind password and the inline OIDC client secret of the security profile (see "trino.security.env"). Not
       rendered when global.security.auth.existingSecret names a Secret the operator provides with the same keys. */ -}}
{{- $auth := .Values.global.security.auth | default dict -}}
{{- $bindPassword := include "trino.auth.bindPassword" . -}}
{{- $oidcInline := include "trino.auth.oidcInline" . -}}
{{- if and (not $auth.existingSecret) (or $bindPassword $oidcInline) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trino.auth.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $bindPassword }}
  bind-password: {{ $bindPassword | b64enc | quote }}
  {{- end }}
  {{- if $oidcInline }}
  oidc-client-secret: {{ include "trino.auth.oidcClientSecret" . | b64enc | quote }}
  {{- end }}
{{- end }}
