{{- /* OpenShift Route — emitted only on OpenShift when ingress.enabled AND route.enabled. Replaces Ingress (ingress.yaml suppresses itself under the same condition). */ -}}
{{- if and .Values.ingress.enabled .Values.route.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
{{- $https := .Values.server.config.https.enabled }}
{{- $host := (first .Values.ingress.hosts).host }}
{{- $path := (first (first .Values.ingress.hosts).paths).path | default "/" }}
{{- $tlsSecret := "" }}
{{- if .Values.ingress.tls }}{{- $tlsSecret = (tpl (first .Values.ingress.tls).secretName $) }}{{- end }}
{{- $termination := include "trino.route.termination" . }}
{{- $destinationCA := "" }}
{{- if eq $termination "reencrypt" }}{{- $destinationCA = include "trino.route.destinationCA" . }}{{- end }}
{{- /* auto: external certificates on Routes need no feature gate from OpenShift 4.19 (Kubernetes 1.32). */}}
{{- $externalSetting := .Values.route.tls.externalCertificate }}
{{- $externalSupported := ternary (semverCompare ">=1.32.0-0" .Capabilities.KubeVersion.Version) (eq (toString $externalSetting) "true") (eq (toString $externalSetting) "auto") }}
{{- $external := and $tlsSecret $externalSupported (ne $termination "passthrough") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ template "trino.coordinator" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ $host | quote }}
  {{- /* passthrough routes cannot carry a path (the router can't read it without terminating TLS) */}}
  {{- if ne $termination "passthrough" }}
  path: {{ $path | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "trino.fullname" . }}
    weight: 100
  port:
    {{- if $https }}
    targetPort: {{ .Values.server.config.https.port }}
    {{- else }}
    targetPort: {{ .Values.service.port }}
    {{- end }}
  tls:
    termination: {{ $termination }}
    insecureEdgeTerminationPolicy: Redirect
    {{- if ne $termination "passthrough" }}
    {{- if $external }}
    {{- /* The router reads the certificate from its Secret: the key is not copied into the Route, and a renewed
           certificate is served without a new release. */}}
    externalCertificate:
      name: {{ $tlsSecret }}
    {{- else if $tlsSecret }}
    {{- $sec := lookup "v1" "Secret" .Release.Namespace $tlsSecret }}
    {{- if $sec }}
    certificate: |-
      {{- index $sec.data "tls.crt" | b64dec | nindent 6 }}
    key: |-
      {{- index $sec.data "tls.key" | b64dec | nindent 6 }}
    {{- end }}
    {{- end }}
    {{- if eq $termination "reencrypt" }}
    destinationCACertificate: |-
      {{- $destinationCA | nindent 6 }}
    {{- end }}
    {{- end }}
  wildcardPolicy: None
{{- if $external }}
---
{{- /* The router reads an external certificate with its own service account, allowed this one Secret only. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "trino.coordinator" . }}-route-certificate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $tlsSecret | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "trino.coordinator" . }}-route-certificate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "trino.coordinator" . }}-route-certificate
subjects:
  - kind: ServiceAccount
    name: {{ .Values.route.tls.routerServiceAccount.name }}
    namespace: {{ .Values.route.tls.routerServiceAccount.namespace }}
{{- end }}
{{- end }}
