{{- if .Values.serviceMonitor.enabled -}}
{{- /* The 'release' label is what a kube-prometheus-stack Prometheus selects ServiceMonitors by. It is set only when
     given: OpenShift user-workload monitoring selects by project, not by label. monitoring.release is the older place
     for it; dig keeps the lookup working when values carry no 'monitoring' block at all. */ -}}
{{- $labels := .Values.serviceMonitor.labels | default dict -}}
{{- $releaseLabel := default "" $labels.release -}}
{{- if not $releaseLabel -}}
  {{- $releaseLabel = dig "release" "" (.Values.monitoring | default dict) -}}
{{- end -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "openmetadata.fullname" . }}
  {{- /* Always the release's own namespace: the only one a project-scoped account can write to, the one OpenShift
       user-workload monitoring reads, and the only one namespaceSelector below matches. */}}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openmetadata.labels" . | nindent 4 }}
    {{- with omit $labels "release" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $releaseLabel }}
    release: {{ $releaseLabel | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "openmetadata.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: admin
      path: /prometheus
      interval: {{ .Values.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: 10s
{{- end }}
