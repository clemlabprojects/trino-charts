{{/*
Basic authentication: OpenMetadata creates its bootstrap administrators (authorization.adminPrincipals) with the
password "admin". This Job sets each of them to the password authorization.adminPassword.existingSecret holds, with
OpenMetadata's own reset-password command, so the password never appears in the server configuration, which the
server prints in its log. It runs after the install (the server must have created the administrators first: it is
retried until it has) and, with resetOnUpgrade, after an upgrade too, for a release that still has the default.
*/}}
{{- $adminPassword := .Values.openmetadata.config.authorization.adminPassword | default dict -}}
{{- if and (eq (include "openmetadata.authProvider" .) "basic") $adminPassword.existingSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openmetadata.fullname" . }}-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openmetadata.adminPasswordLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ ternary "post-install,post-upgrade" "post-install" (eq (toString $adminPassword.resetOnUpgrade) "true") }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "openmetadata.adminPasswordLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "openmetadata.serviceAccountName" . }}
      {{- if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
      securityContext:
        runAsNonRoot: true
        {{- if .Values.runAsUser }}
        runAsUser: {{ .Values.runAsUser }}
        {{- end }}
      {{- else }}{{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}{{- end }}
      {{- with (include "openmetadata.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-password
          image: {{ include "openmetadata.resolveImage" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              domain="${AUTHORIZER_PRINCIPAL_DOMAIN:-open-metadata.org}"
              {{- range (include "openmetadata.adminPrincipals" . | fromJsonArray) }}
              {{- if not (contains ":" .) }}
              echo "Setting the password of the OpenMetadata administrator {{ . }}"
              /opt/openmetadata/bootstrap/openmetadata-ops.sh reset-password -e "{{ . }}@${domain}" -p "$OM_ADMIN_PASSWORD"
              {{- end }}
              {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "openmetadata.configMapName" . }}
          env:
            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openmetadata.dbPasswordSecretName" . }}
                  key: {{ include "openmetadata.dbPasswordSecretKey" . }}
            - name: OM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminPassword.existingSecret | quote }}
                  key: {{ $adminPassword.passwordKey | default "password" | quote }}
          {{- if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- else }}{{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}{{- end }}
          {{- with $adminPassword.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
