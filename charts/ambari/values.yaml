# Ambari (standalone) hosting the Clemlab KDPS view.
#
# The chart deploys ONE Ambari server. It is not a Hadoop cluster manager here: it exists to serve
# the KDPS view, which talks to the Kubernetes/OpenShift API of the cluster it runs in.
#
# Two things are deliberately NOT provisioned by this chart:
#   * the database — Ambari keeps all of its state, including the KDPS view's own configuration,
#     in PostgreSQL. Production installs point at a database the customer already runs.
#   * the cluster credential — the operator supplies it once through the KDPS UI (an OpenShift
#     login, or an uploaded kubeconfig). See `persistence` below for why that survives restarts.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ""                      # falls back to global.imageRegistry
  repository: ambari-kdps
  tag: ""                           # defaults to .Chart.AppVersion
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imageRegistry: registry.clemlab.com/clemlabprojects
  imagePullSecrets: []
  vault:
    enabled: false
    address: ""                     # e.g. https://vault.vault-csi.svc:8200
    namespace: ""                   # Vault Enterprise namespace, if any
    auth:
      method: kubernetes            # kubernetes | approle
      mountPath: kubernetes
      kubernetes:
        role: ""
      approle:
        roleId: ""
        secretId: ""
    csi:
      caCertSecret: ""              # Secret holding the CA that signed Vault's certificate

# --- database -------------------------------------------------------------------------------
# Ambari requires PostgreSQL. This chart only ever CONNECTS to one; it never runs one.
database:
  host: ""                          # required
  port: 5432
  name: ambari
  user: ambari
  # Where the password comes from, in order of preference:
  #   existingSecret  — a Secret the customer already manages (sealed-secrets, ExternalSecrets, …)
  #   vault           — synced from Vault by the CSI driver into `vault.database.secretName`
  #   password        — inline. Development only: it lands in the release values.
  existingSecret: ""
  existingSecretPasswordKey: password
  password: ""
  # Ambari's own schema is created on first start when the database holds none, in one transaction:
  # when that fails, nothing of it is kept and psql's error is in the pod logs.
  #
  # Driver properties, passed straight to the JDBC driver. A database outside the cluster normally
  # wants TLS, which is what these are for:
  #   properties:
  #     ssl: "true"
  #     sslmode: verify-full
  #     sslrootcert: /vault/secrets/pg-ca.pem
  properties: {}

# --- the database schema ----------------------------------------------------------------------
# Each Ambari line -- the first three numbers of the image's version: every 2.8.2.x image is the 2.8.2
# line -- has a database schema of its own, and the server does not start on another line's. Changing
# image.tag within a line needs nothing. Moving it to a new line (2.8.3, 2.9) stops the pod before the
# server starts, with both versions in its logs and the database untouched, until the schema is
# upgraded (OPERATIONS.md §4):
#   1. back the database up;
#   2. sync the new image.tag with enabled=true: the schema is upgraded before the server starts;
#   3. once the pod is Ready, set it back to false, so that the next move waits for a backup again.
# A schema of a later line than the image's is never downgraded: restore the backup instead.
# The upgrade runs before the server listens, so within the time the liveness probe gives the server
# to come up (initialDelaySeconds + periodSeconds x failureThreshold, 300 s by default).
# ambari-kdps images up to 2.8.2.0-160 ignore this.
schemaUpgrade:
  enabled: false

# --- master key -------------------------------------------------------------------------------
# Ambari encrypts its credential store with this key, and the KDPS view encrypts the kubeconfig you
# upload with it. It is REQUIRED: without it the view falls back to a passphrase that is a constant
# in the published source, and the uploaded kubeconfig would only look protected.
#
# It must exist before the release is installed and it must never change: rotate it and everything
# already encrypted with the old one becomes unreadable. The chart will not generate one, because a
# generated value would be re-generated on every Argo CD sync.
masterKey:
  existingSecret: ""                # a Secret you create, or one Vault syncs (see vault.csi.masterKey)
  existingSecretKey: master-key
  value: ""                         # inline. Development only: it lands in the release values.

# --- the first administrator password ---------------------------------------------------------
# On an empty database Ambari creates its "admin" account with the password "admin", which is in
# Ambari's public documentation. The server replaces it with this password on its first start, before
# the pod is Ready, so the Service and the Route never serve a console that accepts admin/admin. It is
# REQUIRED: the chart refuses to render without it unless allowDefault is set.
#
# It sets the FIRST password only. Once the password is no longer the default -- set by this, or
# changed in the UI -- later starts leave it alone, so changing the Secret afterwards changes nothing.
# Needs an ambari-kdps image later than 2.8.2.0-160: with an earlier one the pod never becomes Ready.
adminPassword:
  existingSecret: ""                # a Secret you create, or one Vault syncs (see vault.csi.adminPassword)
  existingSecretKey: password
  value: ""                         # inline. Development only: it lands in the release values.
  # Development only: start without a password and keep admin/admin until someone changes it.
  allowDefault: false

# --- agents -----------------------------------------------------------------------------------
# Ambari as the KDPS operator manages Kubernetes, not a fleet of hosts, so it has no agents to
# authenticate. Leaving this off is what removes the agent SSL listeners -- and with them the
# server-side certificate authority the server would otherwise generate with openssl on first start.
# Turn it on only if this server also manages Ambari agents.
agent:
  enabled: false

# --- Ambari's own TLS -------------------------------------------------------------------------
# The server terminating TLS itself, rather than serving plain HTTP behind a router that does it.
# The certificate comes from a kubernetes.io/tls Secret -- your own, or one Vault syncs -- and an
# init container turns it into the PKCS12 keystore Ambari expects. With this on, the server listens
# on 8443 only, and route.tls.mode should be reencrypt (or passthrough).
api:
  tls:
    enabled: false
    existingSecret: ""              # kubernetes.io/tls; defaults to the Vault-synced one when set
    port: 8443

# --- the cluster the KDPS view drives -------------------------------------------------------
# The view authenticates with an OpenShift login (API URL + user, entered once in the UI) or an
# uploaded kubeconfig. Both are stored by Ambari: the OpenShift login in the database, the
# kubeconfig as a file under /var/lib/ambari-server — which is why persistence is on by default.
#
# The claim is mounted on two sub-paths rather than over /var/lib/ambari-server as a whole:
#   keys/                        the master key and credential store, which encrypt values in
#                                the database and so must not be regenerated on every restart
#   resources/views/k8s-view-data/  the view's working directory: the uploaded kubeconfig and cache
# Everything else under /var/lib/ambari-server belongs to the image and is refreshed by an upgrade.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi

# Extra view jars dropped into /opt/ambari-views and installed at start-up, so the KDPS view can
# be updated without rebuilding the image.
views:
  existingClaim: ""
  configMap: ""

service:
  type: ClusterIP
  port: 8080
  httpsPort: 8443
  annotations: {}

# OpenShift Route. Ingress (below) is used instead on vanilla Kubernetes.
route:
  enabled: true
  host: ""                          # required when enabled; also names the TLS Secret by default
  annotations: {}
  tls:
    # edge          — router terminates TLS with its own default certificate
    # edgeWithCert  — router terminates TLS with OUR certificate, read from a Secret
    # passthrough / reencrypt — only meaningful once Ambari serves HTTPS itself
    mode: edge
    insecureEdgeTerminationPolicy: Redirect
    # The Secret carrying tls.crt / tls.key. Empty means "<route host>-tls", so the certificate is
    # named after the route it serves. Referenced through the Route's externalCertificate field
    # (OpenShift >= 4.16), which keeps the certificate OUT of the rendered manifest — so Argo CD
    # never sees it and never diffs on it.
    secretName: ""
    # externalCertificate requires the ingress router to be allowed to read that Secret.
    grantRouterAccess: true
    # reencrypt only: the CA the router should verify Ambari's own certificate against. Leave empty
    # and use passthrough when the certificate is self-signed or privately issued.
    destinationCACertificate: ""

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: ImplementationSpecific
  annotations: {}
  tls:
    enabled: true
    secretName: ""                  # defaults to "<ingress host>-tls"

# --- Vault ----------------------------------------------------------------------------------
# The master key, the first administrator password, the database password and the certificates,
# read out of Vault through the Secrets Store CSI driver. Turning any one on is what enables the CSI
# volume; global.vault.* says where Vault is. All but the certificate Ambari serves are synced into
# ordinary Kubernetes Secrets (secretObjects) rather than only mounted, so the Deployment and the
# Route consume them the same way whether they came from Vault or not.
#
# Two things the cluster has to provide before this works:
#
#  1. The namespace must allow the driver's inline volume. Without this the Deployment never even
#     creates a ReplicaSet, and the only sign is a ReplicaSetCreateError on the Deployment:
#       oc label ns <namespace> \
#         pod-security.kubernetes.io/enforce=privileged \
#         security.openshift.io/scc.podSecurityLabelSync=false
#
#  2. Vault must have a Kubernetes auth role bound to this release's ServiceAccount, granting read
#     on the paths below.
#
# Note also that a Secret produced this way lives only as long as a pod that mounts it. The Route
# is put in a later Argo CD sync wave for that reason; see templates/route.yaml.
vault:
  csi:
    masterKey:
      enabled: false
      path: ""                      # e.g. secret/data/kdps/ambari/master-key
      key: master-key               # key inside the Vault secret
      secretName: ""                # defaults to "<release>-master-key"
    adminPassword:
      enabled: false
      path: ""                      # e.g. secret/data/kdps/ambari/admin
      key: password                 # key inside the Vault secret
      secretName: ""                # defaults to "<release>-admin-password"
    apiCert:
      enabled: false
      path: ""                      # e.g. secret/data/kdps/ambari/api-cert
      certKey: tls.crt
      keyKey: tls.key
      secretName: ""                # defaults to "<release>-api-tls"
    database:
      enabled: false
      path: ""                      # e.g. secret/data/kdps/ambari/db
      passwordKey: password         # key inside the Vault secret
      secretName: ""                # defaults to "<release>-db"
    routeCert:
      enabled: false
      path: ""                      # e.g. secret/data/kdps/ambari/route-cert
      certKey: tls.crt
      keyKey: tls.key
      # the Secret is named after the route (route.tls.secretName)

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ephemeral-storage is what the pod keeps on its node's disk: the server's logs (unless
# logs.persistence puts them on a claim), the extracted views, Helm's cache and the pod logs. Without
# a request the pod is among the first evicted when the node runs short of disk. The limit relies on
# logs.rotation: with the server's own rotation settings its logs alone can reach nearly 3 GB.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
    ephemeral-storage: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
    ephemeral-storage: 3Gi

# --- stopping the pod ------------------------------------------------------------------------
# On SIGTERM the container's entrypoint signals the server and waits up to stopTimeoutSeconds (passed
# to the image as AMBARI_STOP_TIMEOUT) for it to stop: the KDPS view gives the operations in progress
# about 30 s to finish and Jetty closes its connections. A server still running then is killed.
# Kubernetes kills the whole pod terminationGracePeriodSeconds after SIGTERM, so that must be at
# least 5 s longer; the chart refuses to render otherwise. ambari-kdps images up to 2.8.2.0-160 ignore
# AMBARI_STOP_TIMEOUT and let the server be killed straight away.
terminationGracePeriodSeconds: 90
stopTimeoutSeconds: 50

# --- logs ------------------------------------------------------------------------------------
# The pod logs carry the server log and the security audit log (sign-ins, refused access, changes
# to users, groups and privileges). Audit lines are prefixed with "[ambari-audit] "; ambari-kdps
# images up to 2.8.2.0-160 leave them out. The files under /var/log/ambari-server are only a working
# copy: the cluster's log collection is where the audit trail has to be kept (OPERATIONS.md §5).
logs:
  # Keep /var/log/ambari-server on a volume rather than in the container's filesystem.
  #   emptyDir — survives a container restart (crash, failed liveness probe), not a new pod.
  #              Counts against the pod's ephemeral storage.
  #   pvc      — survives a new pod too (upgrade, eviction, node drain). The claim is kept by
  #              `helm uninstall`, like the data claim.
  persistence:
    enabled: false
    type: emptyDir                  # emptyDir | pvc
    sizeLimit: ""                   # emptyDir only, e.g. 2Gi
    existingClaim: ""               # pvc only: use this claim instead of creating one
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 5Gi
  # How many rotated files the server keeps of its log and its audit log (1 to 20 each). Its own
  # settings keep up to 1.7 GB of server log, which suits a host with a disk of its own. With the pod
  # logs as the record, a few files are enough, and they keep the logs within the ephemeral-storage
  # limit above. Applied by mounting the chart's copy of the server's logback.xml over the image's;
  # set enabled=false to keep the image's.
  rotation:
    enabled: true
    server:
      maxFileSize: 80MB
      maxBackups: 5
    audit:
      maxFileSize: 50MB
      maxBackups: 5

# Ambari's Python calls getpwuid(), and OpenShift runs the pod under a random UID that has no
# /etc/passwd entry. The init container writes one into a copy of /etc/passwd that the server then
# mounts, so the chart works under restricted-v2 without the image having to be rebuilt.
passwdShim:
  enabled: true

podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

livenessProbe:
  initialDelaySeconds: 180
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
# Ready once the login page answers AND the server no longer has the default administrator password
# (see adminPassword), which the image records in /tmp/admin-bootstrapped.
readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
