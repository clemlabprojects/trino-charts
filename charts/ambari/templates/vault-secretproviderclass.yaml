{{- if include "ambari.vault.csiEnabled" . }}
{{- $db := .Values.vault.csi.database }}
{{- $cert := .Values.vault.csi.routeCert }}
{{- $mk := .Values.vault.csi.masterKey }}
{{- $api := .Values.vault.csi.apiCert }}
{{- $objects := list }}
{{- $secretObjects := list }}
{{- if $db.enabled }}
{{- $objects = append $objects (printf "- objectName: %q\n  secretPath: %q\n  secretKey: %s" "db-password" (required "vault.csi.database.path is required" $db.path) $db.passwordKey) }}
{{- end }}
{{- if $cert.enabled }}
{{- $objects = append $objects (printf "- objectName: %q\n  secretPath: %q\n  secretKey: %s" "tls-crt" (required "vault.csi.routeCert.path is required" $cert.path) $cert.certKey) }}
{{- $objects = append $objects (printf "- objectName: %q\n  secretPath: %q\n  secretKey: %s" "tls-key" $cert.path $cert.keyKey) }}
{{- end }}
{{- if $mk.enabled }}
{{- $objects = append $objects (printf "- objectName: %q\n  secretPath: %q\n  secretKey: %s" "master-key" (required "vault.csi.masterKey.path is required" $mk.path) $mk.key) }}
{{- end }}
{{- if $api.enabled }}
{{- $objects = append $objects (printf "- objectName: %q\n  secretPath: %q\n  secretKey: %s" "api-tls-crt" (required "vault.csi.apiCert.path is required" $api.path) $api.certKey) }}
{{- $objects = append $objects (printf "- objectName: %q\n  secretPath: %q\n  secretKey: %s" "api-tls-key" $api.path $api.keyKey) }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "ambari.vault.secretProviderClassName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ required "global.vault.address is required" .Values.global.vault.address | quote }}
    {{- with .Values.global.vault.namespace }}
    vaultNamespace: {{ . | quote }}
    {{- end }}
    {{- if eq (default "kubernetes" .Values.global.vault.auth.method | lower) "kubernetes" }}
    roleName: {{ required "global.vault.auth.kubernetes.role is required" .Values.global.vault.auth.kubernetes.role | quote }}
    vaultKubernetesMountPath: {{ default "kubernetes" .Values.global.vault.auth.mountPath | quote }}
    {{- else }}
    roleId: {{ .Values.global.vault.auth.approle.roleId | quote }}
    secretId: {{ .Values.global.vault.auth.approle.secretId | quote }}
    vaultAppRoleMountPath: {{ default "approle" .Values.global.vault.auth.mountPath | quote }}
    {{- end }}
    {{- with .Values.global.vault.csi.caCertSecret }}
    caCertSecretName: {{ . | quote }}
    {{- end }}
    {{- if $objects }}
    objects: |
{{ join "\n" $objects | indent 6 }}
    {{- end }}
  {{- if or $db.enabled $cert.enabled $mk.enabled $api.enabled }}
  {{- /* Syncing into real Secrets is what lets the Deployment use secretKeyRef and the Route use
         externalCertificate — neither can read a CSI mount. The Secrets exist only while a pod
         mounts the volume, which is why the Deployment always mounts it when Vault is on. */}}
  secretObjects:
  {{- if $db.enabled }}
    - secretName: {{ $db.secretName | default (printf "%s-db" (include "ambari.fullname" .)) | quote }}
      type: Opaque
      data:
        - objectName: "db-password"
          key: {{ $db.passwordKey | quote }}
  {{- end }}
  {{- if $cert.enabled }}
    - secretName: {{ include "ambari.route.tlsSecretName" . | quote }}
      type: kubernetes.io/tls
      data:
        - objectName: "tls-crt"
          key: tls.crt
        - objectName: "tls-key"
          key: tls.key
  {{- end }}
  {{- if $mk.enabled }}
    - secretName: {{ include "ambari.masterKey.secretName" . | quote }}
      type: Opaque
      data:
        - objectName: "master-key"
          key: {{ $mk.key | quote }}
  {{- end }}
  {{- end }}
{{- end }}
