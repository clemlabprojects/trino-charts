{{- /* Only when the password is given inline: an existing Secret or Vault owns it otherwise. */}}
{{- if and (not .Values.database.existingSecret) (not (and (include "ambari.vault.csiEnabled" .) .Values.vault.csi.database.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "ambari.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "database.password is required unless database.existingSecret or Vault is used" .Values.database.password | quote }}
{{- end }}
