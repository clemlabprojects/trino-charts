{{- /* externalCertificate is read by the ingress router's service account, not by this pod, so the
       router needs explicit permission on that one Secret in this namespace. Without it the Route
       is admitted but reports ExternalCertificateValidationFailed and keeps the default cert. */}}
{{- if and .Values.route.enabled (eq .Values.route.tls.mode "edgeWithCert") .Values.route.tls.grantRouterAccess (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-router-cert" (include "ambari.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "ambari.route.tlsSecretName" . | quote }}]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-router-cert" (include "ambari.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-router-cert" (include "ambari.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
{{- end }}
