{{- /* Only when the key is given inline: an existing Secret or Vault owns it otherwise. */}}
{{- if and (not .Values.masterKey.existingSecret) (not (and (include "ambari.vault.csiEnabled" .) .Values.vault.csi.masterKey.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-master-key" (include "ambari.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
  annotations:
    # Losing this key makes everything encrypted with it unreadable, so it outlives the release.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.masterKey.existingSecretKey }}: {{ required "a master key is required: set masterKey.existingSecret, or vault.csi.masterKey.enabled, or masterKey.value" .Values.masterKey.value | quote }}
{{- end }}
