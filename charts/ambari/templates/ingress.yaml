{{- /* Vanilla Kubernetes. On OpenShift the Route above serves the same purpose. */}}
{{- if and .Values.ingress.enabled (not (and .Values.route.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1"))) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ambari.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}]
      secretName: {{ include "ambari.ingress.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "ambari.fullname" . }}
                port:
                  name: http
{{- end }}
