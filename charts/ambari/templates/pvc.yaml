{{- if and (include "ambari.persistence.onClaim" .) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ambari.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
  annotations:
    # This claim holds the KDPS internal CA that signed the certificates of the services KDPS
    # deployed, and Ambari's credential store with the Git credentials of GitOps releases. The master
    # key that encrypts the store is not on it: it comes from a Secret. Losing the claim means a new
    # CA, and the services deployed before and after it no longer trust each other, so it outlives
    # `helm uninstall` and is removed deliberately or not at all.
    helm.sh/resource-policy: keep
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
