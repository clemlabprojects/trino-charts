{{- /* Only when the password is given inline: an existing Secret or Vault owns it otherwise. */}}
{{- if and .Values.adminPassword.value (not .Values.adminPassword.existingSecret) (not (and (include "ambari.vault.csiEnabled" .) .Values.vault.csi.adminPassword.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-admin-password" (include "ambari.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ambari.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.adminPassword.existingSecretKey }}: {{ .Values.adminPassword.value | quote }}
{{- end }}
