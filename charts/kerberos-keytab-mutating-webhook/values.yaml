global:
  imageRegistry: ""   # e.g. "registry.clemlab.com/clemlabprojects"

image:
  # -- Image registry, defaults to empty, which results in DockerHub usage
  registry: ""
  # -- Repository location of the Trino image, typically `organization/imagename`
  repository: kerberos-keytab-mutating-webhook
  # -- Image tag, defaults to the Trino release version specified as `appVersion` from Chart.yaml
  tag: "1.0.0.10"
  # -- Optional digest value of the image specified as `sha256:abcd...`. A specified value overrides `tag`.
  digest: ""
  # -- When true, only the content in `repository` is used as image reference
  useRepositoryAsSoleImageReference: false
  pullPolicy: IfNotPresent

imagePullSecrets: []
appName: kerberos-keytab-mutating-webhook
replicaCount: 2

service:
  port: 443
containerPort: 8443
dnsSuffix: ".svc.cluster.local"

backend:
  url: "https://ambari-backend.ambari-managed-mutating-webhooks.svc:8443"
  krbRealm: "EXAMPLE.COM"
  timeout: "3s"
  retries: 2
  failurePolicyLog: true
  caSecretName: ambari-root-ca
  caMountPath: /ca
  caFile: ca.crt
# How the webhook authenticates to the KDPS view, which it reaches through the Ambari REST API:
# - mtls: each keytab request is signed with the client certificate the view issued (clientMtls.secretName);
#   the view refuses requests it cannot verify.
# - webhook-account: signs in to Ambari as auth.account.username, an account the view creates that may only open
#   its view instance. Its password is derived from the client key, so no password is stored in Kubernetes.
auth:
  mode: "mtls,webhook-account"
  account:
    username: webhook-user  # set by the view

# (created by Ambari)
clientMtls:
  secretName: keytab-webhook-client-tls
  certPath: /auth/client.crt
  keyPath:  /auth/client.key
  caPath:   /auth/ca.crt

# (created by Ambari)
serverTls:
  secretName: keytab-webhook-tls

# REQUIRED: base64(DER) CA used to sign the webhook serving cert
webhook:
  caBundle: ""          # Ambari will set this
  timeoutSeconds: 5
  failurePolicy: Fail

selectors:
  namespace: { key: security.clemlab.com/webhooks-enabled, value: "true" }
  object:    { key: security.clemlab.com/needs-keytab, value: "true" }

# The webhook makes no Kubernetes API call (the pod comes in the AdmissionReview, the view writes the keytab
# Secret), so it gets no RBAC role and no ServiceAccount token.
resources:
  limits: { cpu: 200m, memory: 256Mi }
  requests: { cpu: 50m,  memory: 128Mi }

nodeSelector: {}
tolerations: []
affinity: {}
